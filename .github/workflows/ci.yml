# GitHub Actions CI.
# Alternative pipeline for GitHub-hosted (personal / OSS) projects.
# Runs the same checks as azure-pipelines.yml.
# Safe to delete this file (and the .github folder) if you only use Azure DevOps.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Unit tests + coverage
        run: npm run test:cov

      - name: Build (production)
        run: npm run build:prod

      - name: Build Storybook
        run: npm run build-storybook
