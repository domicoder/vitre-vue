# Azure Pipelines CI for Azure Repos / Azure DevOps.
# This is the PRIMARY pipeline for ready to production projects.
# Runs the same checks as .github/workflows/ci.yml.
# Safe to delete .github/workflows/ci.yml if you only use Azure DevOps.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - bash: echo "##vso[task.setvariable variable=nodeVersion]$(cat .nvmrc)"
    displayName: 'Read Node version from .nvmrc'

  - task: NodeTool@0
    displayName: 'Use Node.js (from .nvmrc)'
    inputs:
      versionSpec: '$(nodeVersion)'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run lint:check
    displayName: 'Lint'

  - script: npm run format:check
    displayName: 'Format check'

  - script: npm run type-check
    displayName: 'Type check'

  - script: npm run test:unit
    displayName: 'Unit tests'

  - script: npm run build:prod
    displayName: 'Build (production)'

  - script: npm run build-storybook
    displayName: 'Build Storybook'
